[project]
name = "grippo"
dynamic = ["version"]
description = "Assistente Git local para o terminal: linguagem natural, LLM local e execução segura"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "GRIPPO contributors" }]
keywords = ["git", "cli", "llm", "ollama", "assistant"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.7",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=5.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
grippo = "grippo.cli.main:main"
GRIPPO = "grippo.cli.main:main"
grippo-api = "grippo.api.app:run"

[project.urls]
# Placeholders: replace once the official repository is defined.
Homepage = "https://example.invalid/OWNER/GRIPPO"
Issues = "https://example.invalid/OWNER/GRIPPO/issues"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "grippo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["grippo"]

[tool.hatch.build.targets.sdist]
include = [
    "grippo",
    "tests",
    "docs",
    "install.sh",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "BLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Portuguese text uses typographic characters on purpose
    "S101",                        # assert is used for internal invariants
    "S404", "S603",                # subprocess is used deliberately, always with argv lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "BLE", "E501"]
"grippo/llm/prompts.py" = ["E501"]  # prompt text is kept verbatim

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not install and not perf'"
markers = [
    "git: uses real git in disposable repositories",
    "security: authorization / bypass tests",
    "llm: needs a real Ollama backend (GRIPPO_TEST_LLM=1)",
    "install: runs install.sh / update / uninstall in a sandbox HOME (slow, needs network)",
    "perf: performance / stability measurements",
]

[tool.coverage.run]
source = ["grippo"]
omit = ["grippo/api/*"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]

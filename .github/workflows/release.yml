name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag must match grippo/__init__.py
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' grippo/__init__.py)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pip install -e '.[dev]'
      - run: ruff check grippo tests && mypy grippo
      - run: pytest
      - run: pytest -m install tests/install
      - run: python -m build && twine check --strict dist/*
      - name: wheel self-test
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/grippo doctor --offline --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Veja CHANGELOG.md" > notes.md
      - name: draft release (published manually after review)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $prerelease \
            --title "GRIPPO $GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    # Trusted Publishing: enable only after configuring the "pypi" environment on PyPI
    # for this repository and setting the repository variable PYPI_PUBLISH=true.
    if: vars.PYPI_PUBLISH == 'true' && !contains(github.ref_name, '-')
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

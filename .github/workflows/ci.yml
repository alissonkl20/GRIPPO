name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check grippo tests
      - run: ruff format --check grippo
      - run: mypy grippo
      - run: bandit -q -c pyproject.toml -r grippo
      - run: bash -n install.sh

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -e '.[dev]'
      - run: pytest --cov=grippo --cov-report=term-missing --cov-report=xml
      - run: pytest -m perf tests/perf
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  installer:
    name: install.sh / update / uninstall (sandbox HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -m install tests/install -v

  build:
    name: build & validate artifacts
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: install wheel in a clean venv and self-test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/grippo --version
          /tmp/wheel-venv/bin/grippo doctor --offline --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
